name: 'Setup Tools'
description: 'Setup tools needed in repo'

runs:
  using: 'composite'
  steps:
    - name: Install Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
    - name: Install dependencies
      shell: bash
      run: npm i
    - name: Set Xcode 26.0  
      if: runner.os == 'macOS'
      shell: bash
      run: sudo xcode-select --switch /Applications/Xcode_26.0.app && xcrun simctl list > /dev/null && xcodebuild -downloadPlatform iOS
