name: "Continuous Integrations"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - next
      - development
      - '*.x'

jobs:
  lint:
    uses: ionic-team/capacitor-actions/.github/workflows/reusable_lint.yml@1541ef6230d16e6def55e51e04ec7b5c4bff87e4
    with:  
      working-directory: .

  build:
    uses: ionic-team/capacitor-actions/.github/workflows/reusable_build.yml@1541ef6230d16e6def55e51e04ec7b5c4bff87e4
    with:
      working-directory: .

  verify-plugin-android:
    needs: ['lint', 'build']
    runs-on: 'xcode-27'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: 'Setup Tools'
        uses: ./.github/actions/setup-tools
      - name: 'Verify Android'
        run: npm run verify:android

  verify-plugin-ios:
    needs: ['lint', 'build']
    runs-on: 'xcode-27'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: 'Setup Tools'
        uses: ./.github/actions/setup-tools
      - name: 'Verify iOS'
        run: npm run verify:ios

  build-example-app-android:
    needs: ['verify-plugin-ios', 'verify-plugin-android']
    runs-on: 'xcode-27'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: 'Setup Tools'
        uses: ./.github/actions/setup-tools
      - name: 'Prepare example app'
        uses: ./.github/actions/prepare-example-app
      - name: 'Build Android example app'
        working-directory: ./example-app/android
        run: ./gradlew clean assembleDebug

  build-example-app-ios:
    needs: ['verify-plugin-ios', 'verify-plugin-android']
    runs-on: 'xcode-27'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: 'Setup Tools'
        uses: ./.github/actions/setup-tools
      - name: 'Prepare example app'
        uses: ./.github/actions/prepare-example-app
      - name: 'Build iOS example app'
        working-directory: ./example-app/ios/App
        run: xcodebuild clean build -project App.xcodeproj -scheme App CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
